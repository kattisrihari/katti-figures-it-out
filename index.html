<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
      margin: 0;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    .link-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      color: #333;
      text-decoration: none;
      text-align: center;
      padding: 15px 0;
      margin: 10px 0;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      font-weight: bold;
      transition: transform 0.2s, background-color 0.2s;
    }
    .link-card:hover {
      transform: translateY(-2px);
      background-color: #007bff;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <h1>My Important Links</h1>

  <!-- Edit your links below -->
  <a class="link-card" href="https://twitter.com/yourhandle" target="_blank">Twitter / X</a>
  <a class="link-card" href="https://linkedin.com/in/yourprofile" target="_blank">LinkedIn</a>
  <a class="link-card" href="https://github.com/yourusername" target="_blank">GitHub Profile</a>
  <a class="link-card" href="https://yourportfolio.com" target="_blank">Portfolio Website</a>

</body>
</html>
