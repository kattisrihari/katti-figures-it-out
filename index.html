<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katti Recommends</title>
  <style>
    :root {
      --bg: #0d1117;              /* ooru.work signature deep background */
      --card-bg: #161b22;         /* slightly lighter card background */
      --text-main: #f0f6fc;       /* crisp white text */
      --text-muted: #8b949e;      /* muted gray for descriptions */
      --border: #30363d;          /* subtle structural borders */
      --orange-accent: #ff6b00;   /* ooru.work primary orange */
      --purple-accent: #8b5cf6;   /* ooru.work primary purple */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      margin: 0;
      line-height: 1.5;
    }

    .header-container {
      text-align: center;
      max-width: 500px;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin: 0 0 8px 0;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 0;
    }

    .highlight-orange {
      color: var(--orange-accent);
      font-weight: 600;
    }

    .highlight-purple {
      color: var(--purple-accent);
      font-weight: 600;
    }

    .links-container {
      width: 100%;
      max-width: 480px;
    }

    .link-card {
      display: block;
      width: 100%;
      background: var(--card-bg);
      color: var(--text-main);
      text-decoration: none;
      text-align: left;
      padding: 20px 24px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.2s ease-in-out;
      box-sizing: border-box;
      position: relative;
    }

    /* Orange gradient hover effect for the first type of cards */
    .link-card.orange-theme:hover {
      border-color: var(--orange-accent);
      background: linear-gradient(180deg, #161b22 0%, rgba(255, 107, 0, 0.08) 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 0, 0.15);
    }

    /* Purple gradient hover effect for the second type of cards */
    .link-card.purple-theme:hover {
      border-color: var(--purple-accent);
      background: linear-gradient(180deg, #161b22 0%, rgba(139, 92, 246, 0.08) 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.15);
    }

    .link-card span {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 400;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>Welcome!</h1>
    <p class="subtitle">Katti recommends you check these <span class="highlight-orange">sites</span> <span class="highlight-purple">out :)</span></p>
  </div>

  <div class="links-container">
    <!-- Card with Orange accent on hover -->
    <a class="link-card orange-theme" href="https://www.ooru.work/" target="_blank">
      <span class="highlight-orange" style="font-size: 1.05rem; margin: 0;">Ooru.work</span>
      <span>A network for namma Kannadigas where professionals and students build their network so referrals can get you interviews.</span>
    </a>

    <!-- Card with Purple accent on hover -->
    <a class="link-card purple-theme" href="https://www.bangalorestartupmap.com/" target="_blank">
      <span class="highlight-purple" style="font-size: 1.05rem; margin: 0;">Bengaluru Startup Map</span>
      <span>Startup maps in Bengaluru. Check who's getting funded in what area!</span>
    </a>
  </div>

</body>
</html>
